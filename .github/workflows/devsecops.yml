name: DevSecOps - Security Scans (CI)

# ─────────────────────────────────────────────────────────────────────────────
# Target: OWASP NodeGoat  (https://github.com/OWASP/NodeGoat)
#
# NodeGoat specifics
# ──────────────────
#   • Requires a MongoDB sidecar.
#   • No official pre-built Docker Hub image — the image is built from the
#     repository Dockerfile during CI and tagged locally.
#   • Default port: 4000
#
# Scanner enable-flags default to true. Set any to false to skip that scanner.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["master", "main"]
  pull_request:
  workflow_dispatch:
    inputs:
      ENABLE_SEMGREP:
        description: "Run Semgrep SAST?"
        required: false
        default: "true"
      ENABLE_TRIVY_FS:
        description: "Run Trivy filesystem scan?"
        required: false
        default: "true"
      ENABLE_TRIVY_IMAGE:
        description: "Run Trivy image scan?"
        required: false
        default: "true"
      ENABLE_ZAP:
        description: "Run OWASP ZAP DAST scan?"
        required: false
        default: "true"

jobs:
  security-scans:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120

    env:
      SCAN_BASE_DIR: "/tmp/devsecops-scans"
      RUN_OUTPUT_DIR: "/tmp/devsecops-scans/${{ github.run_id }}"

      # ── Target configuration ──────────────────────────────────────────────
      APP_NAME:          "nodegoat"
      APP_URL:           "http://target-nodegoat:4000"
      APP_PORT:          "4000"
      DOCKER_IMAGE_NAME: "nodegoat:ci-local"

      # ── Scanner enable/disable flags ──────────────────────────────────────
      ENABLE_SEMGREP:      ${{ github.event.inputs.ENABLE_SEMGREP      || 'true' }}
      ENABLE_TRIVY_FS:     ${{ github.event.inputs.ENABLE_TRIVY_FS     || 'true' }}
      ENABLE_TRIVY_IMAGE:  ${{ github.event.inputs.ENABLE_TRIVY_IMAGE  || 'true' }}
      ENABLE_ZAP:          ${{ github.event.inputs.ENABLE_ZAP          || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Prepare output directory ───────────────────────────────────────────
      - name: Prepare scan output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_OUTPUT_DIR"
          chmod 777 "$RUN_OUTPUT_DIR"
          rm -f "$RUN_OUTPUT_DIR"/* || true
          echo "RUN_OUTPUT_DIR=$RUN_OUTPUT_DIR"
          echo "APP_NAME=$APP_NAME | APP_URL=$APP_URL | IMAGE=$DOCKER_IMAGE_NAME"
          echo "Scanners → semgrep=$ENABLE_SEMGREP trivy_fs=$ENABLE_TRIVY_FS trivy_image=$ENABLE_TRIVY_IMAGE zap=$ENABLE_ZAP"

      # ── Write scan metadata for the CD workflow ────────────────────────────
      - name: Write scan_meta.env
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUN_OUTPUT_DIR/scan_meta.env" <<EOF
          APP_NAME=${APP_NAME}
          APP_URL=${APP_URL}
          DOCKER_IMAGE_NAME=${DOCKER_IMAGE_NAME}
          ENABLE_SEMGREP=${ENABLE_SEMGREP}
          ENABLE_TRIVY_FS=${ENABLE_TRIVY_FS}
          ENABLE_TRIVY_IMAGE=${ENABLE_TRIVY_IMAGE}
          ENABLE_ZAP=${ENABLE_ZAP}
          GIT_COMMIT=${{ github.sha }}
          GIT_BRANCH=${{ github.ref_name }}
          EOF
          echo "scan_meta.env written:"
          cat "$RUN_OUTPUT_DIR/scan_meta.env"

      # ── Build NodeGoat Docker image ────────────────────────────────────────
      - name: Build NodeGoat Docker image
        if: env.ENABLE_TRIVY_IMAGE == 'true' || env.ENABLE_ZAP == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Building $DOCKER_IMAGE_NAME from repo Dockerfile..."
          docker build -t "$DOCKER_IMAGE_NAME" .
          echo "Image built: $(docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' "$DOCKER_IMAGE_NAME")"

      # ── SAST: Semgrep ──────────────────────────────────────────────────────
      - name: "Semgrep SAST -> semgrep.json"
        if: env.ENABLE_SEMGREP == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull returntocorp/semgrep:latest
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "$RUN_OUTPUT_DIR:/out" \
            returntocorp/semgrep:latest \
            semgrep scan \
              --config=auto \
              --config=p/ci \
              --config=p/security-audit \
              --config=p/nodejs \
              --json \
              --output /out/semgrep.json \
              /src
          test -s "$RUN_OUTPUT_DIR/semgrep.json"
          echo "semgrep.json written ($(wc -c < "$RUN_OUTPUT_DIR/semgrep.json") bytes)"

      # ── SCA: Trivy filesystem ──────────────────────────────────────────────
      - name: "Trivy filesystem scan -> trivy_fs.json"
        if: env.ENABLE_TRIVY_FS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/aquasecurity/trivy:0.69.3
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            -v "$RUN_OUTPUT_DIR:/out" \
            ghcr.io/aquasecurity/trivy:0.69.3 \
            fs \
            --scanners vuln,misconfig,secret,license \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy_fs.json \
            /workspace
          test -s "$RUN_OUTPUT_DIR/trivy_fs.json"
          echo "trivy_fs.json written ($(wc -c < "$RUN_OUTPUT_DIR/trivy_fs.json") bytes)"

      # ── SCA: Trivy image ───────────────────────────────────────────────────
      - name: "Trivy image scan -> trivy_image.json"
        if: env.ENABLE_TRIVY_IMAGE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/aquasecurity/trivy:0.69.3
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUN_OUTPUT_DIR:/out" \
            ghcr.io/aquasecurity/trivy:0.69.3 \
            image \
            --scanners vuln,misconfig,secret \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy_image.json \
            "$DOCKER_IMAGE_NAME"
          test -s "$RUN_OUTPUT_DIR/trivy_image.json"
          echo "trivy_image.json written ($(wc -c < "$RUN_OUTPUT_DIR/trivy_image.json") bytes)"

      # ── DAST: ZAP ─────────────────────────────────────────────────────────
      - name: Create docker network (zapnet)
        if: env.ENABLE_ZAP == 'true'
        shell: bash
        run: docker network create zapnet || true

      # ── Start MongoDB for NodeGoat ─────────────────────────────────────────
      - name: "Start MongoDB for NodeGoat"
        if: env.ENABLE_ZAP == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker pull mongo:4.4
          docker rm -f "mongo-${APP_NAME}" 2>/dev/null || true

          docker run -d \
            --name "mongo-${APP_NAME}" \
            --network zapnet \
            --network-alias "mongo-${APP_NAME}" \
            --network-alias mongo \
            mongo:4.4

          echo "Waiting for MongoDB to accept connections..."
          for i in {1..30}; do
            if docker exec "mongo-${APP_NAME}" mongo --eval "db.runCommand({ping:1})" --quiet >/dev/null 2>&1; then
              echo "MongoDB ready after ${i}×2s"
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: MongoDB did not become ready"
          docker logs "mongo-${APP_NAME}" --tail 100 || true
          exit 1

      # ── Start NodeGoat for ZAP ─────────────────────────────────────────────
      - name: "Start target app for ZAP: nodegoat"
        if: env.ENABLE_ZAP == 'true'
        shell: bash
        run: |
          set -euo pipefail

          docker rm -f "target-${APP_NAME}" 2>/dev/null || true
          docker pull curlimages/curl:8.6.0

          # NodeGoat's Dockerfile does not start the app correctly by itself.
          # The official compose flow waits for MongoDB, seeds the DB, then runs npm start.
          docker run -d \
            --name "target-${APP_NAME}" \
            --network zapnet \
            --network-alias "target-${APP_NAME}" \
            -e "PORT=${APP_PORT}" \
            -e "MONGODB_URI=mongodb://mongo-${APP_NAME}:27017/nodegoat" \
            -p "${APP_PORT}:${APP_PORT}" \
            "$DOCKER_IMAGE_NAME" \
            sh -c "until nc -z -w 2 mongo-${APP_NAME} 27017 && echo 'mongo is ready' && node artifacts/db-reset.js && npm start; do echo 'waiting for mongo / db seed...'; sleep 2; done"

          echo "Waiting for $APP_NAME to become ready..."

          for i in {1..90}; do
            RUNNING="$(docker inspect -f '{{.State.Running}}' "target-${APP_NAME}" 2>/dev/null || echo false)"

            if [ "$RUNNING" != "true" ]; then
              echo "ERROR: target-${APP_NAME} container stopped early. Logs:"
              docker logs "target-${APP_NAME}" --tail 200 || true
              exit 1
            fi

            HTTP_CODE="$(docker run --rm --network zapnet curlimages/curl:8.6.0 \
              -sS -o /dev/null -w "%{http_code}" --max-time 5 "$APP_URL" 2>/dev/null || echo 000)"

            if [[ "$HTTP_CODE" =~ ^(200|301|302)$ ]]; then
              echo "$APP_NAME ready after ${i}×2s with HTTP $HTTP_CODE"
              exit 0
            fi

            echo "Attempt ${i}/90: not ready yet, HTTP=$HTTP_CODE"
            sleep 2
          done

          echo "ERROR: $APP_NAME did not become ready in time. Logs:"
          docker logs "target-${APP_NAME}" --tail 200 || true
          exit 1

      # ── ZAP baseline scan ─────────────────────────────────────────────────
      - name: "ZAP baseline scan -> zap.xml"
        if: env.ENABLE_ZAP == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm --network zapnet \
            -v "$RUN_OUTPUT_DIR:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t "$APP_URL" \
            -x zap.xml \
            -r zap.html || true

          test -s "$RUN_OUTPUT_DIR/zap.xml"
          echo "zap.xml written ($(wc -c < "$RUN_OUTPUT_DIR/zap.xml") bytes)"

      - name: "Stop target app and MongoDB"
        if: always() && env.ENABLE_ZAP == 'true'
        shell: bash
        run: |
          docker rm -f "target-${APP_NAME}" 2>/dev/null || true
          docker rm -f "mongo-${APP_NAME}" 2>/dev/null || true

      # ── Verify results ─────────────────────────────────────────────────────
      - name: List scan results
        if: always()
        shell: bash
        run: |
          echo "=== Scan results in $RUN_OUTPUT_DIR ==="
          ls -la "$RUN_OUTPUT_DIR" || true

      # ── DEBUG: Inspect raw scan outputs ────────────────────────────────────
      - name: "[DEBUG] Inspect scan outputs"
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          inspect_semgrep() {
            python3 -c "
          import json, sys
          with open('$RUN_OUTPUT_DIR/semgrep.json') as f:
              d = json.load(f)
          results = d.get('results', [])
          errors  = d.get('errors', [])
          print(f'  findings : {len(results)}')
          print(f'  errors   : {len(errors)}')
          for i, r in enumerate(results[:5]):
              print(f'  [{i+1}] {r.get(\"check_id\",\"?\")} | {r.get(\"path\",\"?\")}:{r.get(\"start\",{}).get(\"line\",\"?\")} | severity={r.get(\"extra\",{}).get(\"severity\",\"?\")}')
          if len(results) > 5:
              print(f'  ... and {len(results)-5} more')
          "
          }

          inspect_trivy() {
            local file="$1"
            python3 -c "
          import json, sys
          with open('$RUN_OUTPUT_DIR/$file') as f:
              d = json.load(f)
          results = d.get('Results', [])
          total = sum(len(r.get('Vulnerabilities') or []) + len(r.get('Misconfigurations') or []) for r in results)
          print(f'  Result blocks : {len(results)} | Total vulns+misconfigs: {total}')
          count = 0
          for r in results:
              for v in (r.get('Vulnerabilities') or [])[:3]:
                  print(f'  [vuln] {v.get(\"VulnerabilityID\",\"?\")} | {v.get(\"PkgName\",\"?\")} | {v.get(\"Severity\",\"?\")}')
                  count += 1
                  if count >= 5: break
              if count >= 5: break
          " "$file"
          }

          inspect_zap() {
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('$RUN_OUTPUT_DIR/zap.xml')
          root = tree.getroot()
          alerts    = root.findall('.//alertitem')
          instances = root.findall('.//instance')
          print(f'  alert types : {len(alerts)} | instances: {len(instances)}')
          for a in alerts[:5]:
              print(f'  [{a.findtext(\"alert\",\"?\")}] risk={a.findtext(\"riskdesc\",\"?\")} count={a.findtext(\"count\",\"?\")}')
          "
          }

          for scanner in semgrep trivy_fs trivy_image zap; do
            echo "══════════════════════════════════════════════════"
            echo "DEBUG: $scanner"
            echo "══════════════════════════════════════════════════"
            case "$scanner" in
              semgrep)
                [[ -s "$RUN_OUTPUT_DIR/semgrep.json" ]] && inspect_semgrep || echo "  SKIPPED / missing"
                ;;
              trivy_fs)
                [[ -s "$RUN_OUTPUT_DIR/trivy_fs.json" ]] && inspect_trivy trivy_fs.json || echo "  SKIPPED / missing"
                ;;
              trivy_image)
                [[ -s "$RUN_OUTPUT_DIR/trivy_image.json" ]] && inspect_trivy trivy_image.json || echo "  SKIPPED / missing"
                ;;
              zap)
                [[ -s "$RUN_OUTPUT_DIR/zap.xml" ]] && inspect_zap || echo "  SKIPPED / missing"
                ;;
            esac
          done

      # ── Upload artifacts to GitHub ─────────────────────────────────────────
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "ci-scan-results-${{ env.APP_NAME }}-${{ github.run_id }}"
          path: "/tmp/devsecops-scans/${{ github.run_id }}/*"
